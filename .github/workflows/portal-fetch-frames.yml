# Pull a portal world's generated frames into docs/media/portal/<world>/.
#
# The frames are made in Higgsfield and land on its CDN. A world lists
# them in its frames.json; this job fetches any that are not in the repo
# yet and commits them, so the site serves its own copies and the world
# stops depending on a third-party URL. A frame listed as .jpg is converted
# and capped at 2048px on its long side so a phone never downloads a 6 MB png.
#
# Runs on its own when a frames.json changes on any branch, or by hand
# from the Actions tab.
name: portal · fetch frames
on:
  push:
    paths: ["tools/05-portal/worlds/*/frames.json", ".github/workflows/portal-fetch-frames.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: imagemagick, for the jpg conversion
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick > /dev/null
      - name: fetch every frame a world lists and does not have yet
        run: |
          set -eu
          for m in tools/05-portal/worlds/*/frames.json; do
            world="$(basename "$(dirname "$m")")"
            out="docs/media/portal/$world"; mkdir -p "$out"
            jq -r 'to_entries[] | select(.key | startswith("_") | not) | "\(.key) \(.value)"' "$m" | while read -r name url; do
              if [ -s "$out/$name" ]; then echo "$world/$name already here"; continue; fi
              curl -fsSL --retry 3 -o /tmp/frame "$url"
              case "$name" in
                *.jpg|*.jpeg) convert /tmp/frame -resize '2048x2048>' -strip -interlace Plane -quality 84 "$out/$name" ;;
                *) mv /tmp/frame "$out/$name" ;;
              esac
              echo "$world/$name $(stat -c %s "$out/$name") bytes"
            done
          done
      - name: commit them
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/media/portal
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -m "portal: fetch frames into docs/media/portal"
          git push
